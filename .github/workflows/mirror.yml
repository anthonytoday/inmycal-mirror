# Nightly standby copy of inmycal.com, served by GitHub Pages at https://mirror.inmycal.com.
# Independent of Cloudflare at serving time. No secrets: it reads the public site only.
# Versioned: each night is one commit on gh-pages, "Mirror of <live commit> (<date>)", only when something
# changed. Any past version can be restored from that history (feeds are byte-stable, so history stays small).
# If the copy fails its checks, nothing is published and the previous copy stays online.
name: Mirror inmycal.com
on:
  schedule:
    - cron: '17 1 * * *' # 05:17 UAE
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copy the live site
        run: node crawl.mjs --out site | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Name this version after the live commit
        id: v
        run: echo "msg=Mirror of $(node -p "require('./site/version.json').commit") ($(TZ=Asia/Dubai date +%F))" >> "$GITHUB_OUTPUT"
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          cname: mirror.inmycal.com
          user_name: inmycal-mirror
          user_email: ops@inmycal.com
          full_commit_message: ${{ steps.v.outputs.msg }}
