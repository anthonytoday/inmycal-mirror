# External uptime check of inmycal.com every 15 minutes, from GitHub's runners (outside Cloudflare).
# Public repo, so Actions minutes are free. On failure it opens one issue "[uptime] ..." (or comments on the
# open one, at most hourly); on recovery it comments and closes it. GitHub's notification settings apply.
# Manual run: Actions > Uptime > Run workflow; "origin" lets you test another URL.
name: Uptime
on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
    inputs:
      origin:
        description: Site to check (empty = inmycal.com)
        required: false
        default: ''
permissions:
  contents: read
  issues: write
concurrency:
  group: uptime
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/uptime.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inmycal.com
        id: check
        continue-on-error: true
        env:
          ORIGIN: ${{ inputs.origin || 'https://inmycal.com' }}
        run: node scripts/uptime.mjs --origin "$ORIGIN" --json uptime.json
      - name: Open, update or close the uptime issue
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('uptime.json', 'utf8'));
            const down = process.env.OUTCOME !== 'success';
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 }))
              .filter((i) => !i.pull_request && i.title.startsWith('[uptime]'));
            if (down) {
              const failing = r.results.filter((x) => !x.ok).map((x) => x.name).join(', ');
              if (!open.length) {
                await github.rest.issues.create({ owner, repo, title: `[uptime] ${new URL(r.origin).host} DOWN: ${failing}`, body: r.summary + '\n\nRunbook: docs/agents/RESILIENCE.md (Failover) in the private sports-calendar repo. This issue closes itself when the checks pass again.' });
              } else if (Date.now() - new Date(open[0].updated_at).getTime() > 55 * 60 * 1000) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body: 'Still down.\n\n' + r.summary });
              }
              core.setFailed('Site check failed: ' + failing);
            } else {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: 'Recovered.\n\n' + r.summary });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
              }
            }
